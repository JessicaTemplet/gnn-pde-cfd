name: hyperbolic_v2
stage: hyperbolic
problem_type: rollout
pde_class: scalar_hyperbolic

model:
  module: hyperbolic/scripts/model.py
  class_name: BurgersStepGNN
  checkpoint: hyperbolic/models/best_model_v2.pt
  init_kwargs:
    node_in_dim: 2
    edge_in_dim: 2
    hidden_dim: 16
    n_layers: 2

data:
  graph: hyperbolic/data/graph.pt
  test_traj: hyperbolic/data/test_traj.pt
  meta: hyperbolic/data/meta.pt

thresholds:
  divergence_scale_factor: 20.0
  # 0.3 is roughly the best shipped model's (Cole-Hopf) level -- v2 improves
  # on v1 but still misses it (README: final rel L2 = 0.648, shock still
  # stalls) and correctly comes back "warn", not "pass".
  max_rel_l2_final: 0.3
